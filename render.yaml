services:
  - type: web
    name: forex-command-center-v4
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: forex-v4-db
          property: connectionString
databases:
  - name: forex-v4-db
    plan: basic-256mb
