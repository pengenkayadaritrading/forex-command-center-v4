{% extends 'base.html' %}{% block content %}<section class="auth card"><h1>{{ title }} ke V4</h1><p>Data tiap pengguna disimpan terpisah. Jangan gunakan password akun broker di sini.</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Email<input type="email" name="email" autocomplete="email" required maxlength="254"></label><label>Password (minimal 12 karakter)<input type="password" name="password" autocomplete="{{ 'new-password' if register else 'current-password' }}" required minlength="12"></label><button type="submit">{{ title }}</button></form><p>{% if register %}Sudah punya akun? <a href="/login">Masuk</a>{% else %}Belum punya akun? <a href="/register">Daftar</a>{% endif %}</p></section>{% endblock %}
